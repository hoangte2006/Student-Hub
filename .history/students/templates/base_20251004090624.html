<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>{% block title %}Trang{% endblock %}</title>
</head>
<body>
  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <nav> 
    <a href="{% url 'home' %}">Trang chủ</a> |
    <a href="{% url 'student_list' %}">Danh sách học sinh</a> |
    <a href="{% url 'add_student' %}">Thêm học sinh</a> |
    <a href="{% url 'dashboard' %}">Dashboard</a>
  </nav>

  {% block content %} 
  {% endblock %}
</body>
</html>
