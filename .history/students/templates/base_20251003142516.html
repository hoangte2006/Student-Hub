<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}Trang{% endblock %}</title>
</head>
<body>
  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  {% block content %}
    <nav>
    <a href="{% url 'student_list' %}">Trang chủ</a> |
    <a href="{% url 'dashboard' %}">Dashboard</a>
  </nav>

  {% endblock %}
</body>
</html>
