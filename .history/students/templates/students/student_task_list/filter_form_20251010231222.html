<form method="get" class="row g-3 mb-4">
  <div class="col-md-2">
    <div class="form-floating">
      <input type="text" class="form-control" id="keyword" name="keyword" placeholder="Tìm theo tên" value="{{ filters.keyword|default_if_none:'' }}">
      <label for="keyword">Tìm theo tên</label>
    </div>
  </div>

  <div class="col-md-1">
    <div class="form-floating">
      <input type="text" class="form-control" id="classroom" name="classroom" placeholder="Lớp học" value="{{ filters.classroom|default_if_none:'' }}">
      <label for="classroom">Lớp học</label>
    </div>
  </div>

  <div class="col-md-1">
    <div class="form-floating">
      <select class="form-select" id="gender" name="gender">
        <option value="">-- GT --</option>
        <option value="M" {% if filters.gender == 'M' %}selected{% endif %}>Nam</option>
        <option value="F" {% if filters.gender == 'F' %}selected{% endif %}>Nữ</option>
        <option value="O" {% if filters.gender == 'O' %}selected{% endif %}>Khác</option>
      </select>
      <label for="gender">Giới tính</label>
    </div>
  </div>

  <div class="col-md-2">
    <div class="form-floating">
      <select class="form-select" id="academic" name="academic">
        <option value="">-- Học lực --</option>
        <option value="G" {% if filters.academic == 'G' %}selected{% endif %}>Giỏi</option>
        <option value="K" {% if filters.academic == 'K' %}selected{% endif %}>Khá</option>
        <option value="T" {% if filters.academic == 'T' %}selected{% endif %}>Trung bình</option>
        <option value="Y" {% if filters.academic == 'Y' %}selected{% endif %}>Yếu</option>
      </select>
      <label for="academic">Học lực</label>
    </div>
  </div>

  <div class="col-md-1">
    <div class="form-floating">
      <input type="number" step="0.1" class="form-control" id="min_score" name="min_score" placeholder="Từ" value="{{ filters.min_score|default_if_none:'' }}">
      <label for="min_score">Từ điểm</label>
    </div>
  </div>

  <div class="col-md-1">
    <div class="form-floating">
      <input type="number" step="0.1" class="form-control" id="max_score" name="max_score" placeholder="Đến" value="{{ filters.max_score|default_if_none:'' }}">
      <label for="max_score">Đến điểm</label>
    </div>
  </div>
  
  <div class="col-md-2">
      <div class="form-floating">
        <select class="form-select" id="study_status" name="study_status">
          <option value="">-- Trạng thái --</option>
          <option value="A" {% if filters.study_status == 'A' %}selected{% endif %}>Đang học</option>
          <option value="N" {% if filters.study_status == 'N' %}selected{% endif %}>Đã nghỉ</option>
          <option value="S" {% if filters.study_status == 'S' %}selected{% endif %}>Đã tốt nghiệp</option>
        </select>
        <label for="study_status">Trạng thái</label>
      </div>
  </div>

  <div class="col-md-1 d-flex align-items-end">
    <button type="submit" class="btn btn-primary w-100 mb-0">Lọc</button>
  </div>

  <div class="col-md-3 text-end">
    <button class="btn btn-outline-secondary" type="button" data-bs-toggle="offcanvas" data-bs-target="#advancedFilter">
      Bộ lọc nâng cao
    </button>
  </div>
  
  <div class="col-md-1 d-flex align-items-end">
    <a href="{% url 'student_list' %}" class="btn btn-outline-secondary w-100">Xóa lọc</a>
  </div>
</form>
