<!DOCTYPE html>
<html>

<head>
    <title>Danh sách học sinh</title>
</head>

<body>
    <form method="get">
        <input type="text" name="q" placeholder="Tìm theo tên..." value="{{ request.GET.q }}">
        <button type="submit">Tìm</button>
    </form>

    <h1>Danh sách học sinh</h1>
    <ul>
        {% for student in students %}
            <li>
                <a href="{% url 'student_detail' student.id %}">{{ student.name }}</a>
                - <a href="{% url 'edit_student' student.id %}">Sửa</a>
                - <a href="{% url 'delete_student' student.id %}">Xóa</a>
            </li>
        {% endfor %}
        <a href="{% url 'add_student' %}">Thêm học sinh mới</a>
        <a href="{% url 'student_detail' student.id %}">{{ student.name }}</a>


    </ul>
</body>

</html>
