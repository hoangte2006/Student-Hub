    {% extends 'base.html' %}
    {% block title %}Sửa học sinh{% endblock %}
    
    {% block content %}
    
    <h2>Sửa học sinh: {{ student.name }}</h2>
    <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Lưu</button>
    <a href="{% url 'student_detail' student.id %}" class="btn btn-secondary">Hủy</a>
    </form>

    <a href="{% url 'student_list' %}">Quay lại danh sách học sinh</a>
    {% endblock %}
