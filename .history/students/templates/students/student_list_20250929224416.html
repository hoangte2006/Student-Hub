<!DOCTYPE html>
<html>

<head>
    <title>Danh sách học sinh</title>
</head>

<body>
    <h1>Danh sách học sinh</h1>
    <ul>
        {% for student in students %}
            <li>{{ student.name }} - {{ student.classroom }} - {{ student.score }}</li>
        {% endfor %}
        <a href="{% url 'add_student' %}">Thêm học sinh mới</a>

    </ul>
</body>

</html>
