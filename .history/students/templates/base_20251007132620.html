<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <title>{% block title %}Trang{% endblock %}</title>
  {% block styles %}{% endblock %}
</head>
<body>
  {% if messages %}
      {% for message in messages %}
        <div class="alert alert-success">{{ message }}</div>
      {% endfor %}
  {% endif %}

  <nav class="mb-4">
    <a href="{% url 'home' %}" class="btn btn-outline-primary me-2">🏠 Trang chủ</a>
    <a href="{% url 'student_list' %}" class="btn btn-outline-success me-2">📋 Học sinh</a>
    <a href="{% url 'dashboard' %}" class="btn btn-outline-info">📊 Dashboard</a>
  </nav>

  {% block content %}{% endblock %}
  <!-- Chỉ giữ block scripts ở đây -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () { <!---->
      const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      tooltipTriggerList.forEach(function (tooltipTriggerEl) {
        new bootstrap.Tooltip(tooltipTriggerEl);
      });
    });
  </script>

  {% block scripts %}{% endblock %}

</body>
</html>
