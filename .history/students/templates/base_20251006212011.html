<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  {% block script%}
  <title>{% block title %}Trang{% endblock %}</title>
</head>
<body>
  {% if messages %}
      {% for message in messages %}
        <div class="alert alert-success">{{ message }}</div>
      {% endfor %}
  {% endif %}

  <nav class="mb-4">
    <a href="{% url 'home' %}" class="btn btn-outline-primary me-2">🏠 Trang chủ</a>
    <a href="{% url 'student_list' %}" class="btn btn-outline-success me-2">📋 Học sinh</a>
    <a href="{% url 'dashboard' %}" class="btn btn-outline-info">📊 Dashboard</a>
  </nav>

  {% block content %} 
  {% endblock %}


</body>
</html>
