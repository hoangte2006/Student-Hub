<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <title>{% block title %}Trang{% endblock %}</title>
  {% block styles %}\
  <link rel="stylesheet" href="{% static 'students/css/base.css' %}">
{% endblock %}
</head>
<body>
  
  {% if messages %}
      {% for message in messages %}
        <div class="alert alert-success">{{ message }}</div>
      {% endfor %}
  {% endif %}

  <nav class="mb-4">
    <div class="dropdown dropdown-hover">
      <a class="btn btn-outline-dark dropdown-toggle" href="#">📁 Menu</a>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="{% url 'home' %}">🏠 Trang chủ</a></li>
        <li><a class="dropdown-item" href="{% url 'student_list' %}">📋 Danh sách học sinh</a></li>
        <li><a class="dropdown-item" href="{% url 'dashboard' %}">📊 Dashboard thống kê</a></li>
      </ul>
    </div>
  </nav>

  {% block content %}{% endblock %}
  <!-- Chỉ giữ block scripts ở đây -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script> 
      document.addEventListener('DOMContentLoaded', function () {
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.forEach(function (tooltipTriggerEl) {
          new bootstrap.Tooltip(tooltipTriggerEl);
        });
      });
    </script>
  {% block scripts %}
    <!-- Các trang con sẽ tự render script của mình -->
  {% endblock %}

</body>
</html>
