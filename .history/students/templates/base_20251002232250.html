<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Hệ thống quản lý học sinh{% endblock %}</title>
</head>
<body>
    {% block content %}
        {% if messages %}
          <ul class="messages">
            {% for message in messages %}
              <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}

        <!-- Nội dung từng trang -->
    {% endblock %}
</body>
</html>
