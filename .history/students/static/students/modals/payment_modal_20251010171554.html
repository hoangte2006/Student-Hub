<div class="modal fade" id="paymentModal{{ student.id }}" tabindex="-1" aria-labelledby="paymentModalLabel{{ student.id }}">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title" id="paymentModalLabel{{ student.id }}">Chi tiết thanh toán - {{ student.name }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
      </div>
      <div class="modal-body">
        <p><strong>Trạng thái:</strong> {{ student.get_payment_status_display }}</p>
        <p><strong>Ngày thanh toán:</strong> {{ student.payment_date|date:"d/m/Y" }}</p>
        <p><strong>Số tiền đã thanh toán:</strong> {{ student.amount_paid|floatformat:0 }} VNĐ</p>
        <p><strong>Ghi chú:</strong> {{ student.payment_note|default:"Không có ghi chú" }}</p>
      </div>
    </div>
  </div>
</div>
