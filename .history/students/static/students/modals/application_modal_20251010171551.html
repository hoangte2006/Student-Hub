<div class="modal fade" id="applicationModal{{ student.id }}" tabindex="-1" aria-labelledby="applicationModalLabel{{ student.id }}">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-warning text-white">
        <h5 class="modal-title" id="applicationModalLabel{{ student.id }}">Chi tiết hồ sơ</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
      </div>
      <div class="modal-body">
        <p><strong>Trạng thái:</strong> {{ student.get_application_status_display }}</p>
        <p><strong>Ngày nộp hồ sơ:</strong> {{ student.application_date|date:"d/m/Y" }}</p>
        <p><strong>Ghi chú:</strong> {{ student.application_note|default:"Không có ghi chú" }}</p>
      </div>
    </div>
  </div>
</div>
